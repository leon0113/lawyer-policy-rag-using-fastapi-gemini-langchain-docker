name: Ready code and deploy

on: [push, workflow_dispatch]

jobs:
  test-code:
    runs-on: ubuntu-latest

    steps:
      - name: copying the codes
        uses: actions/checkout@v7

      - name: install nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 20.15.0

      - name: check new node version
        run: node -v
